[project]
name = "cuentas-claras-api"
version = "0.1.0"
description = "Cuentas Claras HTTP API: invoices, clients and collections for service companies"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14.1",
    "fastapi>=0.115.8",
    "followup-core",
    "followup-platform",
    "psycopg[binary]>=3.2.4",
    "pyjwt[crypto]>=2.10.0",
    "sqlalchemy>=2.0.38",
    "uvicorn[standard]>=0.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cuentas_claras_api"]

[tool.uv.sources]
followup-core = { workspace = true }
followup-platform = { workspace = true }
