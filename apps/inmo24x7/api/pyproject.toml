[project]
name = "inmo24x7-api"
version = "0.1.0"
description = "inmo24x7 HTTP API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14.1",
    "fastapi>=0.115.8",
    "followup-core",
    "psycopg[binary]>=3.2.4",
    "pyjwt[crypto]>=2.10.0",
    "sqlalchemy>=2.0.38",
    "uvicorn[standard]>=0.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inmo24x7_api"]

[tool.uv.sources]
followup-core = { workspace = true }
