name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://followup:followup@localhost:5432/followup_test
      TEST_DATABASE_URL: postgresql+psycopg://followup:followup@localhost:5432/followup_test
      LANGSMITH_TRACING: "false"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: followup
          POSTGRES_PASSWORD: followup
          POSTGRES_DB: followup_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U followup -d followup_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      # Every product's migration branch, and core's.
      - run: uv run alembic upgrade heads
      - run: uv run pytest

  typescript:
    runs-on: ubuntu-latest
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      LANGSMITH_TRACING: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-packages --frozen
      - run: uv run --all-packages python scripts/generate_types.py
      - run: git diff --exit-code -- packages/api-client-inmo24x7/src/schema.ts packages/api-client-cuentas-claras/src/schema.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  deploy-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt/deploy koalaman/shellcheck:v0.10.0 -x \
            deploy.sh restore.sh lib.sh bootstrap.sh backup-now.sh dc.sh install-files.sh \
            backup/backup.sh backup/restore-inside.sh rehearsal/rehearsal.sh rehearsal/smoke.sh
      - name: compose file
        working-directory: deploy
        run: |
          IMAGE_TAG=sha-0000000 ENV_FILE=.env.production.example docker compose \
            --env-file .env.production.example -f compose.prod.yml \
            --profile tools --profile observability --profile cuentas-claras config --quiet
      - name: Caddyfile (with and without Grafana and Cuentas Claras)
        run: |
          for site in grafana no-grafana; do
            for cc in cuentas-claras no-cuentas-claras; do
              docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
                -v "$PWD/deploy/caddy/$site.caddy:/etc/caddy/grafana.caddy:ro" \
                -v "$PWD/deploy/caddy/$cc.caddy:/etc/caddy/cuentas-claras.caddy:ro" \
                -e APP_DOMAIN=app.example.com -e ADMIN_DOMAIN=admin.example.com \
                -e API_DOMAIN=api.example.com -e ACME_EMAIL=ops@example.com \
                -e SUPABASE_URL=https://ref.supabase.co \
                -e SENTRY_INGEST_HOST=https://o1.ingest.us.sentry.io \
                -e GRAFANA_DOMAIN=grafana.example.com -e "GRAFANA_ALLOWED_IPS=0.0.0.0/0 ::/0" \
                -e CC_APP_DOMAIN=cuentasclaras.example.com \
                -e CC_ADMIN_DOMAIN=cuentasclaras-admin.example.com \
                -e CC_API_DOMAIN=cuentasclaras-api.example.com \
                caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
            done
          done
      - name: Loki and Alloy configs
        working-directory: deploy/observability
        run: |
          docker run --rm -v "$PWD/loki/config.yaml:/etc/loki/config.yaml:ro" grafana/loki:3.7.9 \
            -config.file=/etc/loki/config.yaml -config.expand-env=true -verify-config
          for config in config.alloy config.local.alloy; do
            docker run --rm -e COMPOSE_PROJECT=inmo24x7 -e APP_ENV=production \
              -v "$PWD/alloy/$config:/etc/alloy/$config:ro" grafana/alloy:v1.21.3 \
              validate "/etc/alloy/$config"
          done

  # Images are published only for a product whose production values exist as repository
  # variables (docs/go-live.md, step 4). A product that is not ready yet is skipped with a
  # notice, never an error: tests, lint and the schema checks above run on every push anyway.
  release-gate:
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs:
      - python
      - typescript
      - deploy-files
    runs-on: ubuntu-latest
    outputs:
      inmo24x7_ready: ${{ steps.check.outputs.inmo24x7_ready }}
      cuentas_claras_ready: ${{ steps.check.outputs.cuentas_claras_ready }}
    env:
      INMO24X7_API_URL: ${{ vars.INMO24X7_API_URL }}
      INMO24X7_PANEL_URL: ${{ vars.INMO24X7_PANEL_URL }}
      CUENTAS_CLARAS_API_URL: ${{ vars.CUENTAS_CLARAS_API_URL }}
      CUENTAS_CLARAS_PANEL_URL: ${{ vars.CUENTAS_CLARAS_PANEL_URL }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
      META_APP_ID: ${{ vars.META_APP_ID }}
      META_EMBEDDED_SIGNUP_CONFIG_ID: ${{ vars.META_EMBEDDED_SIGNUP_CONFIG_ID }}
      # Cuentas Claras has its own Meta app (a Meta app has one webhook URL).
      CUENTAS_CLARAS_META_APP_ID: ${{ vars.CUENTAS_CLARAS_META_APP_ID }}
      CUENTAS_CLARAS_META_EMBEDDED_SIGNUP_CONFIG_ID: ${{ vars.CUENTAS_CLARAS_META_EMBEDDED_SIGNUP_CONFIG_ID }}
    steps:
      - id: check
        run: |
          check() {
            local product=$1 output=$2 missing=""
            shift 2
            for name in "$@"; do
              [ -n "${!name}" ] || missing="$missing $name"
            done
            if [ -n "$missing" ]; then
              echo "::notice::$product images skipped. Missing repository variables:$missing (docs/go-live.md, step 4)"
              echo "$output=false" >> "$GITHUB_OUTPUT"
            else
              echo "$output=true" >> "$GITHUB_OUTPUT"
            fi
          }
          check inmo24x7 inmo24x7_ready INMO24X7_API_URL INMO24X7_PANEL_URL SUPABASE_URL \
            SUPABASE_ANON_KEY META_APP_ID META_EMBEDDED_SIGNUP_CONFIG_ID
          check "Cuentas Claras" cuentas_claras_ready CUENTAS_CLARAS_API_URL \
            CUENTAS_CLARAS_PANEL_URL SUPABASE_URL SUPABASE_ANON_KEY \
            CUENTAS_CLARAS_META_APP_ID CUENTAS_CLARAS_META_EMBEDDED_SIGNUP_CONFIG_ID

  images-inmo24x7:
    if: needs.release-gate.outputs.inmo24x7_ready == 'true'
    needs: release-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: inmo24x7-api
            dockerfile: apps/inmo24x7/api/Dockerfile
          # Each panel has its own Sentry project and DSN (optional; docs/go-live.md).
          - image: inmo24x7-web
            dockerfile: apps/inmo24x7/web/Dockerfile
            sentry_dsn_var: SENTRY_DSN_PANEL
            sentry_project_var: SENTRY_PROJECT_PANEL
          - image: inmo24x7-backoffice
            dockerfile: apps/inmo24x7/backoffice/Dockerfile
            sentry_dsn_var: SENTRY_DSN_BACKOFFICE
            sentry_project_var: SENTRY_PROJECT_BACKOFFICE
    env:
      INMO24X7_API_URL: ${{ vars.INMO24X7_API_URL }}
      INMO24X7_PANEL_URL: ${{ vars.INMO24X7_PANEL_URL }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
      META_APP_ID: ${{ vars.META_APP_ID }}
      META_EMBEDDED_SIGNUP_CONFIG_ID: ${{ vars.META_EMBEDDED_SIGNUP_CONFIG_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare image metadata
        run: |
          {
            echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "APP_VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
            echo "IMAGE_PREFIX=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          } >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:sha-${{ github.sha }}
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            VITE_AUTH_MODE=supabase
            VITE_API_URL=${{ env.INMO24X7_API_URL }}
            VITE_SUPABASE_URL=${{ env.SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ env.SUPABASE_ANON_KEY }}
            VITE_PANEL_URL=${{ env.INMO24X7_PANEL_URL }}
            VITE_META_APP_ID=${{ env.META_APP_ID }}
            VITE_META_EMBEDDED_SIGNUP_CONFIG_ID=${{ env.META_EMBEDDED_SIGNUP_CONFIG_ID }}
            VITE_SENTRY_DSN=${{ matrix.sentry_dsn_var && vars[matrix.sentry_dsn_var] || '' }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ matrix.sentry_project_var && vars[matrix.sentry_project_var] || '' }}
          # Source maps are uploaded to Sentry only when this secret exists (then deleted from
          # the image). A BuildKit secret never lands in a layer.
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  images-cuentas-claras:
    if: needs.release-gate.outputs.cuentas_claras_ready == 'true'
    needs: release-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: cuentas-claras-api
            dockerfile: apps/cuentas-claras/api/Dockerfile
          - image: cuentas-claras-web
            dockerfile: apps/cuentas-claras/web/Dockerfile
            sentry_dsn_var: CUENTAS_CLARAS_SENTRY_DSN_PANEL
            sentry_project_var: CUENTAS_CLARAS_SENTRY_PROJECT_PANEL
          - image: cuentas-claras-backoffice
            dockerfile: apps/cuentas-claras/backoffice/Dockerfile
            sentry_dsn_var: CUENTAS_CLARAS_SENTRY_DSN_BACKOFFICE
            sentry_project_var: CUENTAS_CLARAS_SENTRY_PROJECT_BACKOFFICE
    env:
      CUENTAS_CLARAS_API_URL: ${{ vars.CUENTAS_CLARAS_API_URL }}
      CUENTAS_CLARAS_PANEL_URL: ${{ vars.CUENTAS_CLARAS_PANEL_URL }}
      CUENTAS_CLARAS_META_APP_ID: ${{ vars.CUENTAS_CLARAS_META_APP_ID }}
      CUENTAS_CLARAS_META_EMBEDDED_SIGNUP_CONFIG_ID: ${{ vars.CUENTAS_CLARAS_META_EMBEDDED_SIGNUP_CONFIG_ID }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare image metadata
        run: |
          {
            echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "APP_VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
            echo "IMAGE_PREFIX=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          } >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:sha-${{ github.sha }}
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            VITE_AUTH_MODE=supabase
            VITE_CUENTAS_CLARAS_API_URL=${{ env.CUENTAS_CLARAS_API_URL }}
            VITE_SUPABASE_URL=${{ env.SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ env.SUPABASE_ANON_KEY }}
            VITE_PANEL_URL=${{ env.CUENTAS_CLARAS_PANEL_URL }}
            VITE_CUENTAS_CLARAS_META_APP_ID=${{ env.CUENTAS_CLARAS_META_APP_ID }}
            VITE_CUENTAS_CLARAS_META_EMBEDDED_SIGNUP_CONFIG_ID=${{ env.CUENTAS_CLARAS_META_EMBEDDED_SIGNUP_CONFIG_ID }}
            VITE_SENTRY_DSN=${{ matrix.sentry_dsn_var && vars[matrix.sentry_dsn_var] || '' }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ matrix.sentry_project_var && vars[matrix.sentry_project_var] || '' }}
          # Source maps are uploaded to Sentry only when this secret exists (then deleted from
          # the image). A BuildKit secret never lands in a layer.
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # After a push to the default branch built inmo24x7's images: the Deploy workflow with this
  # commit. It waits for an approval of the production environment (its required reviewers),
  # and is skipped when the images were (release gate) or DEPLOY_ENABLED is not "true".
  # Cuentas Claras's images, when built, must be ready too (its profile pulls them).
  deploy-inmo24x7:
    needs:
      - images-inmo24x7
      - images-cuentas-claras
    if: >-
      !cancelled() && needs.images-inmo24x7.result == 'success' &&
      needs.images-cuentas-claras.result != 'failure'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      sha: ${{ github.sha }}
    # DEPLOY_* live in the production environment, read by the called job itself; inherit
    # covers them when they are repository secrets instead.
    secrets: inherit
