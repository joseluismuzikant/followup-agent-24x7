name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://followup:followup@localhost:5432/followup_test
      TEST_DATABASE_URL: postgresql+psycopg://followup:followup@localhost:5432/followup_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: followup
          POSTGRES_PASSWORD: followup
          POSTGRES_DB: followup_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U followup -d followup_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run alembic upgrade head
      - run: uv run pytest

  typescript:
    runs-on: ubuntu-latest
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-packages --frozen
      - run: uv run --all-packages python scripts/generate_types.py
      - run: git diff --exit-code -- packages/api-client-inmo24x7/src/schema.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  images:
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs:
      - python
      - typescript
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: inmo24x7-api
            dockerfile: apps/inmo24x7/api/Dockerfile
          - image: inmo24x7-web
            dockerfile: apps/inmo24x7/web/Dockerfile
          - image: inmo24x7-backoffice
            dockerfile: apps/inmo24x7/backoffice/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare image metadata
        run: |
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          echo "APP_VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" >> "$GITHUB_ENV"
          echo "IMAGE_PREFIX=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:sha-${{ github.sha }}
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            VITE_API_URL=${{ vars.INMO24X7_API_URL || secrets.INMO24X7_API_URL || 'http://localhost:8001' }}
            SUPABASE_URL=${{ vars.SUPABASE_URL || '' }}
            SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || '' }}
            SUPABASE_JWT_SECRET=${{ secrets.SUPABASE_JWT_SECRET || '' }}
            SUPABASE_JWKS_URL=${{ vars.SUPABASE_JWKS_URL || '' }}
            VITE_SUPABASE_URL=${{ vars.SUPABASE_URL || '' }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
