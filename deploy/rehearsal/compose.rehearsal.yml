# The local production rehearsal: compose.prod.yml plus a local Postgres 17 (standing in for
# Supabase's database), Mailpit, Caddy with its own CA on *.localhost, and backups to a local
# folder. Auth is the local Supabase CLI stack. Used by rehearsal.sh; never on a server.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rehearsal
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - rehearsal_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 20
    networks: [internal]

  mailpit:
    image: axllent/mailpit:v1.33.0
    ports:
      - "127.0.0.1:58025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    networks: [internal]

  api:
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  cc-api:
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  cc-worker:
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  migrate:
    depends_on:
      db:
        condition: service_healthy

  caddy:
    ports: !override
      - "${REHEARSAL_HTTP_PORT:-80}:80"
      - "${REHEARSAL_HTTPS_PORT:-443}:443"

  grafana:
    # Not 3000: the development stack's Grafana may be running.
    ports: !override
      - "127.0.0.1:53000:3000"

  backup:
    # The local "bucket" is a volume; root writes to it (production runs as postgres).
    user: root
    volumes:
      - rehearsal_backups:/backups

volumes:
  rehearsal_db: {}
  rehearsal_backups: {}
