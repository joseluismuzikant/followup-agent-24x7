# Dashboards live in git (deploy/observability/grafana/dashboards): nothing to back up, and a
# change in the UI is not kept. Edit the JSON and redeploy.
apiVersion: 1

providers:
  - name: inmo24x7
    folder: inmo24x7
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards
