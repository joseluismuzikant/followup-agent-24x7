# Loki for one VM: single binary, filesystem storage on the loki_data volume, no auth (only
# reachable on the compose network; nothing publishes its port). Started with
# -config.expand-env=true, so ${LOKI_RETENTION_DAYS} comes from the environment.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  # Deletes chunks older than retention_period (below).
  retention_enabled: true
  retention_delete_delay: 2h
  compaction_interval: 10m

limits_config:
  retention_period: ${LOKI_RETENTION_DAYS:-14}d
  # Generous for one product's logs; a runaway loop is cut here, not on the disk.
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 8
  max_label_names_per_series: 10
  # Our labels are service, environment and level: everything else is a JSON field.
  max_streams_per_user: 1000
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  max_query_lookback: ${LOKI_RETENTION_DAYS:-14}d
  allow_structured_metadata: true
  volume_enabled: true

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 64

ruler:
  # Alerts are Grafana-managed (deploy/observability/grafana/provisioning/alerting).
  enable_api: false

analytics:
  reporting_enabled: false
