# LLM prices for the usage and cost screens (backoffice → Consumo).
#
# USD per 1 million tokens, per model as written in LLM_MODEL ("provider:model"). A row
# applies from effective_from (a UTC date) until the next row of the same model, so a price
# change is a NEW row: keep the old one, or past months are re-priced by the recompute script.
#
# Empty strings mean "not priced yet": calls of that model store no cost and the screen flags
# them. Never guess a price: copy it from the provider's pricing page and put that URL in
# `source`. cached_input_per_mtok may stay empty when the provider has no cache discount.
#
# Transcription (TRANSCRIBE_MODEL, voice notes) is priced per audio length, in its own
# [[audio_price]] rows: usd_per_hour, billed by the second (a started second counts whole).
# Empty means "not priced yet", as above.
#
# After fixing a price, recompute past rows (dry run first):
#   uv run --all-packages python scripts/recompute_llm_costs.py --from 2026-11-01
#   uv run --all-packages python scripts/recompute_llm_costs.py --from 2026-11-01 --apply
#
# Example (made-up numbers, not a real price):
# [[price]]
# model = "provider:model-name"
# effective_from = 2026-01-01
# input_per_mtok = "3.00"
# output_per_mtok = "15.00"
# cached_input_per_mtok = "0.30"
# source = "https://provider.example/pricing"

# --- Anthropic (Claude) ---------------------------------------------------------------------
# Claude Haiku 5.5: prices for prompts up to 100K tokens (Sofía's are far below). A prompt over
# 100K tokens pays 5x (0.50 / 2.50 / 0.05); this file has one price per model.
[[price]]
model = "anthropic:claude-haiku-5-5"
effective_from = 2026-11-21
input_per_mtok = "0.10"
output_per_mtok = "0.50"
cached_input_per_mtok = "0.01"
source = "https://platform.claude.com/docs/en/about-claude/pricing"

[[price]]
model = "anthropic:claude-sonnet-5-5"
effective_from = 2026-11-01
input_per_mtok = "2.00"
output_per_mtok = "10.00"
cached_input_per_mtok = "0.10"
source = "https://platform.claude.com/docs/en/about-claude/pricing"

# --- DeepSeek -------------------------------------------------------------------------------
# Off-peak prices. Peak hours (01:00–04:00 and 06:00–10:00 UTC, Mon–Fri, except Chinese public
# holidays) cost 2x: flash 0.30 / 1.20 / 0.006, v4-pro 1.32 / 3.96 / 0.044. The file has one
# price per model, so it uses off-peak, which covers most Argentine daytime traffic: calls at
# peak hours are under-counted by half.
[[price]]
model = "deepseek:deepseek-flash"
effective_from = 2026-11-21
input_per_mtok = "0.15"
output_per_mtok = "0.60"
cached_input_per_mtok = "0.003"
source = "https://api-docs.deepseek.com/quick_start/pricing"

[[price]]
model = "deepseek:deepseek-v4-pro"
effective_from = 2026-11-21
input_per_mtok = "0.66"
output_per_mtok = "1.98"
cached_input_per_mtok = "0.022"
source = "https://api-docs.deepseek.com/quick_start/pricing"

