[project]
name = "followup-core"
version = "0.1.0"
description = "Shared domain and application engine"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.8",
    "pydantic>=2.10.6",
    "sqlalchemy>=2.0.38",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/followup_core"]
