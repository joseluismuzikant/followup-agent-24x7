[project]
name = "followup-core"
version = "0.1.0"
description = "Shared domain and application engine"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.8",
    "langchain==1.4.7",
    "langchain-core==1.7.1",
    "langgraph==1.2.18",
    "langgraph-checkpoint==4.3.1",
    "langgraph-checkpoint-postgres==3.2.0",
    "langsmith==0.14.15",
    "psycopg[binary]>=3.2.4",
    "pydantic>=2.10.6",
    "sqlalchemy>=2.0.38",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/followup_core"]
